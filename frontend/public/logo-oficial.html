<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logo oficial — Central Mutuos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>body { margin:0; background:#0a0a0a; }</style>
</head>
<body>
<div id="logo" style="width:640px;height:280px;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="font-family:'Playfair Display',serif;font-size:38px;font-weight:700;letter-spacing:4px;white-space:nowrap;
    background:linear-gradient(135deg,#BF953F,#FCF6BA,#B38728,#FBF5B7,#AA771C);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 12px rgba(191,149,63,0.55))">CENTRAL MUTUOS</div>
  <div style="width:340px;height:1.5px;margin:12px 0 9px;background:linear-gradient(90deg,transparent,#d4af37 20%,#d4af37 80%,transparent)"></div>
  <div style="font-family:'Playfair Display',serif;color:#d4af37;font-size:15.4px;letter-spacing:10px;font-weight:400">CON CRECES</div>
</div>
</body>
</html>
